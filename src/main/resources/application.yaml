spring:
  application:
    name: book-store

  datasource:
    url: jdbc:postgresql://localhost:5432/book_store
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  # Привязывает сервер ко всем сетевым интерфейсам (обычно это значение по умолчанию)
  address: 127.0.0.200
  # Порт, на котором работает приложение (по умолчанию 8080)
  port: 8080